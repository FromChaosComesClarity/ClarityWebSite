<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512" role="img" aria-label="Clarity">
  <!-- The Aperture C, the app's own mark, on the site's ground.
       Explicit width/height, not viewBox alone - without an intrinsic size a browser
       rasterises this into its own default box and the mark lands off-centre. -->
